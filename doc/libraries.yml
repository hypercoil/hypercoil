# Federation registry (SPEC §3.3). Drives: the colour-key legend (generated, so
# it cannot drift), the umbrella build's clone/render list, and per-library
# accents. Phase-1 slice = nitrix + tensorbids; remaining libraries are listed
# but not yet built (status: scaffold/aspirational) and are added incrementally.
libraries:
  nitrix:
    blurb: "GPU-accelerated pure numerics for neuroimaging (statistics, geometry, registration) in JAX/XLA."
    repo: https://github.com/hypercoil/nitrix
    ref: main
    base_path: /nitrix/
    accent: "#00A59B"          # brand teal
    docs_subdir: docs
    status: active
  tensorbids:
    blurb: "Reference implementation of the BITS on-disk data structure (BIDS-compatible, tensor-native)."
    repo: https://github.com/hypercoil/tensorbids
    ref: main
    base_path: /tensorbids/
    accent: "#FF6E00"          # brand orange
    docs_subdir: docs
    status: active
  niffi:
    blurb: "Foreign-function interfaces to community C/C++ neuroimaging kernels, in JAX."
    repo: https://github.com/hypercoil/niffi
    ref: main
    base_path: /niffi/
    accent: "#FFEB23"          # brand yellow
    docs_subdir: docs
    status: scaffold
  ilex:
    blurb: "Local inference of discipline-specific ML models, plus model-training utilities, in JAX/Equinox."
    repo: https://github.com/hypercoil/ilex
    ref: main
    base_path: /ilex/
    accent: "#6464FF"          # brand blue
    docs_subdir: docs
    status: scaffold
  nimox:
    blurb: "JAX/Equinox neural-network modules for neuroimaging: the equinox.Module building blocks (architectures, losses, schedulers) the model zoo composes."
    repo: https://github.com/hypercoil/nimox
    ref: main
    base_path: /nimox/
    accent: "#8246E1"          # brand violet
    docs_subdir: docs
    status: scaffold
  thrux:
    blurb: "In-memory dispatch and graph assembly over the substrate numerics; the raise/lower bridge to neuroimaging containers."
    repo: https://github.com/hypercoil/thrux
    ref: main
    base_path: /thrux/
    accent: "#CDEB05"          # brand green
    docs_subdir: docs
    status: scaffold
  bitsjax:
    blurb: "Dataset-level awareness over the on-disk BITS structure, bridging it to the dataset-agnostic glue."
    repo: https://github.com/hypercoil/bitsjax
    ref: main
    base_path: /bitsjax/
    accent: "#CD0F55"          # brand maroon
    docs_subdir: docs
    status: scaffold
  entense:
    blurb: "ETL and workflow orchestration into the accelerated on-disk data structure."
    repo: https://github.com/hypercoil/entense
    ref: docs/federation-scaffold   # TEMP: recore in flight; flip to main when feature + docs land
    base_path: /entense/
    accent: "#FF00FF"          # brand rose
    docs_subdir: docs
    status: scaffold
  gramform:
    blurb: "Grammars compiling string formulae (Wilkinson-style models, fslmaths-style commands) into functions."
    repo: https://github.com/hypercoil/gramform
    ref: docs/federation-scaffold   # TEMP: nwx in flight; flip to main when feature + docs land
    base_path: /gramform/
    accent: "#FF3B30"          # brand-derived coral
    docs_subdir: docs
    status: scaffold
  conveyant:
    blurb: "Compositional function orchestration with semantic typing."
    repo: https://github.com/hypercoil/conveyant
    ref: docs/federation-scaffold   # TEMP: pipeline in flight; flip to main when feature + docs land
    base_path: /conveyant/
    accent: "#00D6C8"          # brand-derived aqua
    docs_subdir: docs
    status: scaffold
  hyve:
    blurb: "Compositional visualisation for neuroimaging datasets."
    repo: https://github.com/hypercoil/hyve
    ref: main
    base_path: /hyve/
    accent: "#B586FF"          # brand-derived violet tint
    docs_subdir: docs
    status: aspirational
